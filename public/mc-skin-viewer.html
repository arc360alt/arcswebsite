<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin Viewer 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8B4513 0%, #654321 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4A7C59 0%, #2F5233 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }
        .controls {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        label {
            font-weight: 600;
            color: #333;
        }
        input[type="text"], select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #4A7C59;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 150px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4A7C59 0%, #2F5233 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 124, 89, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #4A7C59;
            background: #f0f8f4;
        }
        #canvas-container {
            width: 100%;
            height: 600px;
            background: #f5f5f5;
            position: relative;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        #downloadBtn {
            margin-top: 15px;
            width: 100%;
        }
        .hidden {
            display: none;
        }
        #error {
            color: #d32f2f;
            padding: 10px;
            background: #ffebee;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Minecraft Skin Viewer 3D</h1>
            <p>View your Minecraft skins in 3D</p>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="skinType">Skin Type:</label>
                <select id="skinType">
                    <option value="classic">Classic (4px arms)</option>
                    <option value="slim">Slim (3px arms)</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="username">Minecraft Java Username:</label>
                <input type="text" id="username" placeholder="Enter username (e.g., Notch)">
                <button class="btn-primary" onclick="loadFromUsername()">Load Skin</button>
            </div>
            
            <div class="control-group">
                <label>Or Upload Your Own Skin:</label>
                <div class="upload-area" id="uploadArea">
                    <p>📁 Click or drag and drop a skin file here</p>
                    <p style="font-size: 14px; color: #666; margin-top: 10px;">Supports PNG files (64x64 or 64x32)</p>
                </div>
                <input type="file" id="fileInput" accept="image/png" class="hidden">
            </div>
            
            <div id="error" class="hidden"></div>
        </div>
        
        <div id="canvas-container">
            <div id="info">Drag to rotate • Scroll to zoom</div>
        </div>
        
        <button id="downloadBtn" class="btn-primary hidden" onclick="downloadSkin()">Download Skin</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, player, controls;
        let currentSkinType = 'classic';
        let currentSkinUrl = null;
        
        // Initialize Three.js scene
        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);
            
            camera = new THREE.PerspectiveCamera(45, container.offsetWidth / container.offsetHeight, 0.1, 1000);
            camera.position.set(0, 12, 40);
            camera.lookAt(0, 12, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.offsetWidth, container.offsetHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight2.position.set(-10, 10, -10);
            scene.add(directionalLight2);
            
            // Simple orbit controls
            setupControls();
            
            // Load default skin (Steve)
            loadDefaultSkin();
            
            animate();
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function setupControls() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let rotation = { x: 0, y: 0 };
            let radius = 40;
            
            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            
            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isDragging && player) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;
                    
                    rotation.y += deltaX * 0.01;
                    rotation.x += deltaY * 0.01;
                    rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotation.x));
                    
                    camera.position.x = radius * Math.sin(rotation.y) * Math.cos(rotation.x);
                    camera.position.y = 12 + radius * Math.sin(rotation.x);
                    camera.position.z = radius * Math.cos(rotation.y) * Math.cos(rotation.x);
                    camera.lookAt(0, 12, 0);
                    
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                }
            });
            
            renderer.domElement.addEventListener('mouseup', () => {
                isDragging = false;
            });
            
            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                radius = Math.max(20, Math.min(80, radius + e.deltaY * 0.05));
                camera.position.x = radius * Math.sin(rotation.y) * Math.cos(rotation.x);
                camera.position.y = 12 + radius * Math.sin(rotation.x);
                camera.position.z = radius * Math.cos(rotation.y) * Math.cos(rotation.x);
                camera.lookAt(0, 12, 0);
            });
        }
        
        // Apply proper Minecraft UV mapping to a box
        // Minecraft skin UV layout: each cube is laid out as a cross pattern
        // where depth goes around, then width, then height vertically
        function setMinecraftUVs(geometry, u, v, width, height, depth, textureWidth, textureHeight) {
            const uvs = geometry.attributes.uv.array;
            
            // Convert pixel coordinates to UV (0-1 range)
            function px(x) { return x / textureWidth; }
            function py(y) { return 1 - (y / textureHeight); }
            
            // Three.js box geometry face order: right, left, top, bottom, front, back
            // Minecraft UV layout for a cuboid starting at (u,v):
            //        [top]
            // [left][front][right][back]
            //        [bottom]
            
            // Right face (+X) - texture position: u+depth, v+depth, size: depth×height
            uvs[0] = px(u + depth + width); uvs[1] = py(v + depth);
            uvs[2] = px(u + depth + width + depth); uvs[3] = py(v + depth);
            uvs[4] = px(u + depth + width); uvs[5] = py(v + depth + height);
            uvs[6] = px(u + depth + width + depth); uvs[7] = py(v + depth + height);
            
            // Left face (-X) - texture position: u, v+depth, size: depth×height
            uvs[8] = px(u + depth); uvs[9] = py(v + depth);
            uvs[10] = px(u); uvs[11] = py(v + depth);
            uvs[12] = px(u + depth); uvs[13] = py(v + depth + height);
            uvs[14] = px(u); uvs[15] = py(v + depth + height);
            
            // Top face (+Y) - texture position: u+depth, v, size: width×depth
            uvs[16] = px(u + depth); uvs[17] = py(v + depth);
            uvs[18] = px(u + depth + width); uvs[19] = py(v + depth);
            uvs[20] = px(u + depth); uvs[21] = py(v);
            uvs[22] = px(u + depth + width); uvs[23] = py(v);
            
            // Bottom face (-Y) - texture position: u+depth+width, v, size: width×depth
            uvs[24] = px(u + depth + width); uvs[25] = py(v + depth);
            uvs[26] = px(u + depth + width + width); uvs[27] = py(v + depth);
            uvs[28] = px(u + depth + width); uvs[29] = py(v);
            uvs[30] = px(u + depth + width + width); uvs[31] = py(v);
            
            // Front face (+Z) - texture position: u+depth, v+depth, size: width×height
            uvs[32] = px(u + depth + width); uvs[33] = py(v + depth);
            uvs[34] = px(u + depth); uvs[35] = py(v + depth);
            uvs[36] = px(u + depth + width); uvs[37] = py(v + depth + height);
            uvs[38] = px(u + depth); uvs[39] = py(v + depth + height);
            
            // Back face (-Z) - texture position: u+depth+width+depth, v+depth, size: width×height
            uvs[40] = px(u + depth + width + depth + width); uvs[41] = py(v + depth);
            uvs[42] = px(u + depth + width + depth); uvs[43] = py(v + depth);
            uvs[44] = px(u + depth + width + depth + width); uvs[45] = py(v + depth + height);
            uvs[46] = px(u + depth + width + depth); uvs[47] = py(v + depth + height);
            
            geometry.attributes.uv.needsUpdate = true;
        }
        
        function createPlayer(skinTexture, isSlim) {
            const group = new THREE.Group();
            
            const texture = skinTexture;
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            
            const material = new THREE.MeshLambertMaterial({ 
                map: texture, 
                transparent: true,
                alphaTest: 0.5
            });
            
            // Head (8x8x8)
            const headGeo = new THREE.BoxGeometry(8, 8, 8);
            setMinecraftUVs(headGeo, 0, 0, 8, 8, 8, 64, 64);
            const head = new THREE.Mesh(headGeo, material);
            head.position.y = 24;
            group.add(head);
            
            // Head layer / Hat (8x8x8 but slightly larger)
            const headLayerGeo = new THREE.BoxGeometry(8.5, 8.5, 8.5);
            setMinecraftUVs(headLayerGeo, 32, 0, 8, 8, 8, 64, 64);
            const headLayer = new THREE.Mesh(headLayerGeo, material);
            headLayer.position.y = 24;
            group.add(headLayer);
            
            // Body (8x12x4)
            const bodyGeo = new THREE.BoxGeometry(8, 12, 4);
            setMinecraftUVs(bodyGeo, 16, 16, 8, 12, 4, 64, 64);
            const body = new THREE.Mesh(bodyGeo, material);
            body.position.y = 14;
            group.add(body);
            
            // Body layer (8x12x4)
            const bodyLayerGeo = new THREE.BoxGeometry(8.5, 12.5, 4.5);
            setMinecraftUVs(bodyLayerGeo, 16, 32, 8, 12, 4, 64, 64);
            const bodyLayer = new THREE.Mesh(bodyLayerGeo, material);
            bodyLayer.position.y = 14;
            group.add(bodyLayer);
            
            const armWidth = isSlim ? 3 : 4;
            
            // Right arm (4x12x4 or 3x12x4)
            const rightArmGeo = new THREE.BoxGeometry(armWidth, 12, 4);
            setMinecraftUVs(rightArmGeo, 40, 16, armWidth, 12, 4, 64, 64);
            const rightArm = new THREE.Mesh(rightArmGeo, material);
            rightArm.position.set(isSlim ? -5.5 : -6, 14, 0);
            group.add(rightArm);
            
            // Right arm layer
            const rightArmLayerGeo = new THREE.BoxGeometry(armWidth + 0.5, 12.5, 4.5);
            setMinecraftUVs(rightArmLayerGeo, 40, 32, armWidth, 12, 4, 64, 64);
            const rightArmLayer = new THREE.Mesh(rightArmLayerGeo, material);
            rightArmLayer.position.set(isSlim ? -5.5 : -6, 14, 0);
            group.add(rightArmLayer);
            
            // Left arm (4x12x4 or 3x12x4)
            const leftArmGeo = new THREE.BoxGeometry(armWidth, 12, 4);
            setMinecraftUVs(leftArmGeo, 32, 48, armWidth, 12, 4, 64, 64);
            const leftArm = new THREE.Mesh(leftArmGeo, material);
            leftArm.position.set(isSlim ? 5.5 : 6, 14, 0);
            group.add(leftArm);
            
            // Left arm layer
            const leftArmLayerGeo = new THREE.BoxGeometry(armWidth + 0.5, 12.5, 4.5);
            setMinecraftUVs(leftArmLayerGeo, 48, 48, armWidth, 12, 4, 64, 64);
            const leftArmLayer = new THREE.Mesh(leftArmLayerGeo, material);
            leftArmLayer.position.set(isSlim ? 5.5 : 6, 14, 0);
            group.add(leftArmLayer);
            
            // Right leg (4x12x4)
            const rightLegGeo = new THREE.BoxGeometry(4, 12, 4);
            setMinecraftUVs(rightLegGeo, 0, 16, 4, 12, 4, 64, 64);
            const rightLeg = new THREE.Mesh(rightLegGeo, material);
            rightLeg.position.set(-2, 2, 0);
            group.add(rightLeg);
            
            // Right leg layer
            const rightLegLayerGeo = new THREE.BoxGeometry(4.5, 12.5, 4.5);
            setMinecraftUVs(rightLegLayerGeo, 0, 32, 4, 12, 4, 64, 64);
            const rightLegLayer = new THREE.Mesh(rightLegLayerGeo, material);
            rightLegLayer.position.set(-2, 2, 0);
            group.add(rightLegLayer);
            
            // Left leg (4x12x4)
            const leftLegGeo = new THREE.BoxGeometry(4, 12, 4);
            setMinecraftUVs(leftLegGeo, 16, 48, 4, 12, 4, 64, 64);
            const leftLeg = new THREE.Mesh(leftLegGeo, material);
            leftLeg.position.set(2, 2, 0);
            group.add(leftLeg);
            
            // Left leg layer
            const leftLegLayerGeo = new THREE.BoxGeometry(4.5, 12.5, 4.5);
            setMinecraftUVs(leftLegLayerGeo, 0, 48, 4, 12, 4, 64, 64);
            const leftLegLayer = new THREE.Mesh(leftLegLayerGeo, material);
            leftLegLayer.position.set(2, 2, 0);
            group.add(leftLegLayer);
            
            return group;
        }
        
        function loadSkin(imageUrl, isFromJava = false) {
            // Use an image element to load cross-origin images
            const img = new Image();
            img.crossOrigin = "anonymous";
            
            img.onload = () => {
                // Create a canvas and draw the image to it
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                // Create texture from canvas
                const texture = new THREE.Texture(canvas);
                texture.needsUpdate = true;
                texture.magFilter = THREE.NearestFilter;
                texture.minFilter = THREE.NearestFilter;
                
                if (player) {
                    scene.remove(player);
                }
                
                const isSlim = currentSkinType === 'slim';
                player = createPlayer(texture, isSlim);
                scene.add(player);
                
                // Show download button only if loaded from Java API
                if (isFromJava) {
                    currentSkinUrl = imageUrl;
                    document.getElementById('downloadBtn').classList.remove('hidden');
                } else {
                    currentSkinUrl = null;
                    document.getElementById('downloadBtn').classList.add('hidden');
                }
                
                hideError();
            };
            
            img.onerror = (error) => {
                console.error('Image load error:', error);
                showError('Failed to load skin texture. Try uploading the skin file instead.');
            };
            
            img.src = imageUrl;
        }
        
        function loadDefaultSkin() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            // Create a simple Steve skin with proper UV layout
            ctx.fillStyle = '#F0C080';
            ctx.fillRect(0, 0, 64, 64);
            
            // Head front
            ctx.fillStyle = '#E0B070';
            ctx.fillRect(8, 8, 8, 8);
            
            // Eyes
            ctx.fillStyle = '#303090';
            ctx.fillRect(10, 10, 2, 2);
            ctx.fillRect(14, 10, 2, 2);
            
            // Mouth
            ctx.fillStyle = '#805040';
            ctx.fillRect(10, 13, 1, 1);
            ctx.fillRect(15, 13, 1, 1);
            
            // Hair (on hat layer)
            ctx.fillStyle = '#604020';
            ctx.fillRect(40, 8, 8, 8);
            
            const dataUrl = canvas.toDataURL();
            loadSkin(dataUrl);
        }
        
        async function loadFromUsername() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                showError('Please enter a username');
                return;
            }
            
            const skinUrl = `https://mineskin.eu/skin/${encodeURIComponent(username)}`;
            loadSkin(skinUrl, true);
            hideError();
        }
        
        function downloadSkin() {
            if (!currentSkinUrl) return;
            
            const link = document.createElement('a');
            link.href = currentSkinUrl;
            link.download = 'minecraft_skin.png';
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        function loadFromFile(file) {
            if (!file || !file.type.match('image/png')) {
                showError('Please upload a PNG file');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    if ((img.width !== 64 || (img.height !== 64 && img.height !== 32))) {
                        showError('Skin must be 64x64 or 64x32 pixels');
                        return;
                    }
                    loadSkin(e.target.result);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }
        
        function hideError() {
            document.getElementById('error').classList.add('hidden');
        }
        
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.offsetWidth / container.offsetHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.offsetWidth, container.offsetHeight);
        }
        
        // Event listeners
        document.getElementById('skinType').addEventListener('change', (e) => {
            currentSkinType = e.target.value;
            if (player && player.children[0].material.map) {
                const currentTexture = player.children[0].material.map;
                // Recreate the player with the new skin type using the existing texture
                scene.remove(player);
                const isSlim = currentSkinType === 'slim';
                player = createPlayer(currentTexture, isSlim);
                scene.add(player);
            }
        });
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            loadFromFile(file);
        });
        
        fileInput.addEventListener('change', (e) => {
            loadFromFile(e.target.files[0]);
        });
        
        // Initialize
        init();
    </script>
</body>
</html>
