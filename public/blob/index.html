<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Custom Gradient Canvas">
<meta property="og:description" content="Check out this custom gradient!" id="og-description">
<meta property="og:image" content="https://via.placeholder.com/1200x630/607998/ffffff?text=Custom+Gradient">
<meta property="og:url" content="" id="og-url">
<meta name="theme-color" content="#607998" id="theme-color">
<meta name="twitter:card" content="summary_large_image">
<title>Gradient Canvas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button class="settings-button" id="settingsBtn">⚙️</button>

<div class="settings-panel hidden" id="settingsPanel">
  <button class="close-button" id="closeBtn">×</button>
  <h3>Gradient Colors</h3>
  
  <div class="color-input-group">
    <label for="color1">Color 1</label>
    <div class="color-input-wrapper">
      <input type="color" id="color1" value="#607998">
      <input type="text" id="color1-text" value="#607998">
    </div>
  </div>

  <div class="color-input-group">
    <label for="color2">Color 2</label>
    <div class="color-input-wrapper">
      <input type="color" id="color2" value="#4c81c0">
      <input type="text" id="color2-text" value="#4c81c0">
    </div>
  </div>

  <div class="color-input-group">
    <label for="color3">Color 3</label>
    <div class="color-input-wrapper">
      <input type="color" id="color3" value="#1d5395">
      <input type="text" id="color3-text" value="#1d5395">
    </div>
  </div>

  <div class="color-input-group">
    <label for="color4">Color 4</label>
    <div class="color-input-wrapper">
      <input type="color" id="color4" value="#7f83b4">
      <input type="text" id="color4-text" value="#7f83b4">
    </div>
  </div>

  <div class="button-group">
    <button class="randomize-button" id="randomizeBtn">🎲 Randomize</button>
  </div>

  <div class="button-group">
    <button class="copy-url-button" id="copyUrlBtn">Copy URL</button>
    <button class="reset-button" id="resetBtn">Reset</button>
  </div>
  <p>You can hide this settings button by pressing "H" And that setting will also be embeded into the URL</p>
</div>

<div class="copy-notification hidden" id="copyNotification">
  URL copied to clipboard!
</div>

<canvas id="gradient-canvas" data-transition-in></canvas>
<script type="module" src="script.js"></script>
</body>
</html>
